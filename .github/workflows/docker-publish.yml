name: Publish Docker image

on:
  push:
    tags:
      - '*.*.*'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/spark-plug
  SPARK_VERSION: 4.2.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Sparkless base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Build and push Spark image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            SPARK_VERSION=${{ env.SPARK_VERSION }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ env.SPARK_VERSION }}
